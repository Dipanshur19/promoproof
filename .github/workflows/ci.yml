name: Validate deployment handoff
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-and-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: npm ci --no-audit --no-fund
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m unittest discover -s tests -v
      - run: npm run check
      - run: npm run build
      - run: python scripts/smoke.py
      - run: python scripts/release_bundle.py --check-only
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: docker build -t promoproof:ci .
      - name: Start container without model keys
        run: docker run -d --name promoproof -p 127.0.0.1:7860:7860 promoproof:ci
      - run: python scripts/smoke.py --url http://127.0.0.1:7860
      - if: always()
        run: docker rm -f promoproof || true
